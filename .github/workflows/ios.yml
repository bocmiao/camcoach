name: iOS 构建并上传 TestFlight

# 只在手动触发和 main 分支推送时跑。
# 不挂在 PR 上——一次 macOS 构建很贵，别让每次改文案都烧一轮。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # 必须是 macOS runner。GitHub 提供的是真 Mac 云机，这就是"没有 Mac 也能编 iOS"的全部秘密。
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 环境自曝（出问题时先看这段）
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          ruby --version

      - name: 装 XcodeGen
        run: brew install xcodegen

      # ---------- 签名材料 ----------
      # 证书私钥是在你 Windows 上生成的，CI 只负责"导入"，绝不"创建"。
      # 让 CI 创建证书 = 私钥生在几分钟后就被销毁的机器上，Apple 那边多一张永远用不了的证书，
      # 而每个账号的发布证书名额是有限的。这条坑有人踩过，为此废掉三个名额。
      - name: 导入签名证书
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          printf '%s' "$CERT_P12_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          # 少了这一行，codesign 会弹一个没人能点的 GUI 授权框，然后卡到超时。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null

          security list-keychain -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: 安装描述文件
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$PROFILE_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/profile.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      # ---------- 生成工程 ----------
      - name: 生成 Xcode 工程
        run: |
          set -euo pipefail
          xcodegen generate
          # 生成完立刻列一遍 scheme。scheme 名字对不上是这里最常见的失败原因，
          # 与其等 archive 阶段报一个含糊的错，不如现在就说清楚。
          xcodebuild -list -project CamCoach.xcodeproj

      # ---------- 编译归档 ----------
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project CamCoach.xcodeproj \
            -scheme CamCoach \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CamCoach.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            COMPILER_INDEX_STORE_ENABLE=NO

      # ---------- 导出 ipa ----------
      - name: 导出 IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.camcoach.app</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CamCoach.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates

          ls -la "$RUNNER_TEMP/export"

      # ---------- 上传 ----------
      # 用 fastlane 上传，不用 altool：altool 早就被标记废弃，Xcode 版本一换就可能消失。
      - name: 上传到 TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IPA_PATH: ${{ runner.temp }}/export/CamCoach.ipa
        run: |
          set -euo pipefail
          gem install fastlane --no-document
          fastlane upload

      - name: 失败时把关键产物留下来
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/*.xcarchive/Info.plist
          retention-days: 3
