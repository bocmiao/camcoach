# XcodeGen 工程描述文件
# 为什么不用 .xcodeproj：那是个几千行的 pbxproj，手写必错，而且你本地没有 Xcode 打不开、改不了。
# 这里用一个 YAML 描述工程，CI 里跑 `xcodegen generate` 生成 .xcodeproj。
# 好处是这份文件可读、可 diff、可在 Windows 上直接改。

name: CamCoach

options:
  bundleIdPrefix: com.bocmiao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 关掉脚本沙盒，避免个别构建阶段被拦
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CamCoach:
    type: application
    platform: iOS
    sources:
      - path: CamCoach
        excludes:
          # Info.plist 由下面的 info 段生成，不能再被当成资源打进去
          - "Info.plist"

    info:
      path: CamCoach/Info.plist
      properties:
        CFBundleDisplayName: 取景助手
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # 连相机走本地网络，这条文案不给的话 iOS 会静默拦截
        NSLocalNetworkUsageDescription: 连接相机时需要访问本地网络，用于读取取景画面与拍摄参数。
        # ImageCaptureCore 在 iOS 上把 USB 相机当外部相机处理，读这条声明。
        # 缺了它 ICDeviceBrowser 一台设备都枚举不出来，而且不报错、不弹窗，
        # 现象就是「点了没反应」——排查时会一路往协议层找，方向全错。
        NSCameraUsageDescription: 连接相机后读取取景画面与拍摄参数，用于在拍摄时给出提示。画面只在本机处理，不上传。

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bocmiao.camcoach
        # 必须和 App Store Connect 里建的那个版本对上。
        # 包里写 0.1.0、ASC 里是 1.0，上传会报
        # 409 ENTITY_ERROR.RELATIONSHIP.INVALID.INVALID_STATE（buildUpload）。
        MARKETING_VERSION: "1.0"
        # 每次上传都要是一个没被用过的号，Apple 不接受重复的 build 号，
        # 而且上传不可撤销 —— 占掉的号永远拿不回来。
        #
        # 已用掉：1、2、3（都是 ios.yml 还挂 push 时自动上传的，白占）
        # 当前：4 = 第一个带相机探测功能的包
        #
        # 发新包前先在这里 +1，再手动触发 ios.yml。
        CURRENT_PROJECT_VERSION: "12"
        # 手动签名：证书和 profile 都由 CI 从 secrets 导入，不让 Xcode 自己去要
        CODE_SIGN_STYLE: Manual
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        # 没有这一行，asset catalog 里的 AppIcon 不会被编译进包，
        # Info.plist 就不会有 CFBundleIconName，上传时 Apple 直接拒收：
        #   Missing Info.plist value: 'CFBundleIconName' (90713)
        #   Missing required icon file 120x120 (90022)
        # 这两个错误都发生在上传阶段，编译和签名都是过的，很容易拖到最后才发现。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# 显式声明 scheme，不依赖 XcodeGen 的默认推断。
# 因为 workflow 里 archive 要用 -scheme CamCoach，名字对不上就是一句含糊的报错。
schemes:
  CamCoach:
    build:
      targets:
        CamCoach: all
    run:
      config: Debug
    archive:
      config: Release
